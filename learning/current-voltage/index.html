tory="false" aria-label="現在の値"><div><small>電圧 V</small><strong id="vValue">6.0</strong><em>V</em></div><div><small>抵抗 R</small><strong id="rValue">3.0</strong><em>Ω</em></div><div><small>電流 I</small><strong id="iValue">2.00</strong><em>A</em></div></section><section class="controls"><div class="row"><label for="voltage">電圧</label><input id="voltage" type="range" min="1" max="12" step="0.1" value="6"><output id="voltageOut">6V</output></div><div class="row"><label for="resistance">抵抗 R</label><input id="resistance" type="range" min="0.5" max="12" step="0.1" value="3"><output id="resistanceOut">3.0Ω</output></div></section><div class="buttons"><button class="primary" id="reset">リセット</button><button id="resetAlt">初期値へ</button></div><p class="explain" id="explain">オームの法則 V=RI。電流 I=V/R として求めます。抵抗が一定なら、電圧を2倍にすると電流も2倍です。</p><p class="foot">金属などのオームの法則に従う抵抗を、温度一定として扱う理想回路のモデルです。 <a href="https://www.mext.go.jp/content/20210830-mxt_kyoiku01-100002608_05.pdf" target="_blank" rel="noreferrer">学習内容の参考資料</a></p></main><script type="module" src="./lesson.mjs"></script></body></html>
