<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>動く点Pと面積・グラフ | 助手A</title><meta name="description" content="点Pを動かして、三角形の面積とグラフの関係を直感的に確かめよう。"><style>
:root{color-scheme:dark;background:#08101d;color:#f1f5f9;font-family:system-ui,"Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:560px;min-height:100dvh;margin:auto;padding:10px 12px;display:grid;align-content:start;gap:clamp(6px,1vh,12px)}h1{font-size:clamp(17px,2.7vh,24px);margin:0}.sub{font-size:12px;color:#b7c5d7}.card{background:#111d30;border:1px solid #334155;border-radius:12px;padding:clamp(7px,1.1vh,12px)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.metrics small{display:block;color:#b7c5d7}.metrics strong{font-size:clamp(21px,3.5vh,30px);font-variant-numeric:tabular-nums}.figure{width:100%;height:clamp(125px,26vh,230px);display:block}.graph{width:100%;height:clamp(118px,23vh,205px);display:block}.label{font-size:12px;font-weight:700}.control{display:flex;align-items:center;gap:9px}.control input{flex:1;min-width:0;min-height:44px;accent-color:#38bdf8;touch-action:pan-x}.control label,.control output{font-size:13px;white-space:nowrap}.control output{min-width:42px;text-align:right}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{min-height:44px;border-radius:10px;border:1px solid #64748b;background:#1e3a5f;color:white;font-size:14px;font-weight:650}.desc{font-size:13px;line-height:1.45}details{font-size:12px;color:#bdc9d8}summary{min-height:30px;cursor:pointer}@media(max-height:650px){main{gap:5px}.card{padding:6px}.figure{height:clamp(105px,23vh,150px)}.graph{height:clamp(100px,19vh,145px)}}
</style></head><body><main><header><h1>動く点Pで面積はどう変わる？</h1><div class="sub">点Pを動かして、三角形とグラフを見比べよう</div></header>
<div class="metrics"><div class="card"><small>時間</small><strong id="timeValue">3.0</strong> 秒</div><div class="card"><small>三角形APCの面積</small><strong id="areaValue">4.5</strong> cm²</div></div>
<div class="card"><div class="label">長方形 ABCD（横6cm・縦3cm）</div><svg class="figure" viewBox="0 0 340 165" role="img" aria-label="AからBを経てCへ動く点Pと三角形APC"><rect x="55" y="18" width="228" height="114" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon id="triangle" points="" fill="#38bdf8" fill-opacity=".28" stroke="#38bdf8" stroke-width="2"/><circle id="point" r="7" fill="#fb923c" stroke="white" stroke-width="2"/><g fill="#e2e8f0" font-size="13"><text x="39" y="148">A</text><text x="290" y="149">B</text><text x="290" y="14">C</text><text x="39" y="14">D</text><text x="150" y="154">6cm</text><text x="5" y="80">3cm</text></g><text id="pLabel" fill="#fb923c" font-size="13" font-weight="bold">P</text></svg></div>
<div class="card"><div class="label">時間と面積のグラフ <span class="sub">● 現在の位置</span></div><svg class="graph" viewBox="0 0 340 170" role="img" aria-label="時間0から9秒、面積0から9平方センチメートルの折れ線グラフ"><g id="grid"></g><path d="M42 145 L222 19 L312 145" fill="none" stroke="#38bdf8" stroke-width="3"/><path id="guide" fill="none" stroke="#fb923c" stroke-dasharray="4 4"/><circle id="graphPoint" r="5" fill="#fb923c" stroke="white" stroke-width="2"/></svg></div>
<div class="card"><div class="control"><label for="time">時間</label><input id="time" type="range" min="0" max="9" step="0.01" value="3"><output id="timeOut">3.0秒</output></div><div class="buttons"><button id="play" type="button">▶ 再生</button><button id="reset" type="button">↺ 最初に戻す</button></div></div>
<div class="card desc" id="explain">Pが右へ進むと、三角形APCの面積が増える。</div>
<details><summary>くわしい説明・条件</summary>点PはA→B→Cを毎秒1cmで移動。面積は0〜6秒で1.5×時間、6〜9秒で3×(9−時間) cm²。三角形APDではBC上で面積が一定になるため、今回は三角形APCを使います。</details>
</main><script type="module">
import {pointAt,areaAt,explain} from './point-p.mjs';
const q=id=>document.getElementById(id),s={time:3,playing:false,last:null};
const fmt=n=>n.toFixed(1),X=t=>42+30*t,Y=a=>145-14*a;
const grid=q('grid'),ns='http://www.w3.org/2000/svg';
for(let t=0;t<=9;t+=3){const x=X(t);grid.insertAdjacentHTML('beforeend',`<line x1="${x}" x2="${x}" y1="19" y2="145" stroke="#94a3b8" stroke-opacity=".14"/><text x="${x}" y="160" fill="#cbd5e1" text-anchor="middle" font-size="11">${t}</text>`)}
for(let a=0;a<=9;a+=3){const y=Y(a);grid.insertAdjacentHTML('beforeend',`<line x1="42" x2="312" y1="${y}" y2="${y}" stroke="#94a3b8" stroke-opacity=".14"/><text x="34" y="${y+4}" fill="#cbd5e1" text-anchor="end" font-size="11">${a}</text>`)}
function render(){const t=s.time,p=pointAt(t),a=areaAt(t),px=55+38*p.x,py=132-38*p.y,gx=X(t),gy=Y(a);q('timeValue').textContent=fmt(t);q('areaValue').textContent=fmt(a);q('timeOut').textContent=fmt(t)+'秒';q('time').value=t;q('point').setAttribute('cx',px);q('point').setAttribute('cy',py);q('triangle').setAttribute('points',`55,132 ${px},${py} 283,18`);q('pLabel').setAttribute('x',Math.min(304,px+9));q('pLabel').setAttribute('y',Math.max(15,py-8));q('graphPoint').setAttribute('cx',gx);q('graphPoint').setAttribute('cy',gy);q('guide').setAttribute('d',`M${gx} 145 V${gy} H42`);q('explain').textContent=explain(t);q('play').textContent=s.playing?'Ⅱ 一時停止':'▶ 再生'}
function pause(){s.playing=false;s.last=null;render()}
q('time').addEventListener('input',e=>{s.time=Number(e.target.value);s.last=null;render()});
q('play').addEventListener('click',()=>{if(s.playing){pause();return}if(s.time>=9)s.time=0;s.playing=true;s.last=null;render()});
q('reset').addEventListener('click',()=>{s.time=0;pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function frame(now){if(s.playing){if(s.last!==null)s.time=Math.min(9,s.time+Math.max(0,(now-s.last)/1000));s.last=now;if(s.time>=9){s.playing=false;s.last=null}render()}requestAnimationFrame(frame)}
render();requestAnimationFrame(frame);
</script></body></html>
