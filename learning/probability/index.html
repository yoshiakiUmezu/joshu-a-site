<header class="top"><nav aria-label="教材の出口"><a class="back" href="/learning/">← 教材一覧</a></nav><nav class="crumb" aria-label="パンくずリスト"><a href="/">ホーム</a> / <a href="/learning/">LEARNING</a> / <a href="/learning/#subject-math">算数</a> / <span aria-current="page">確率</span></nav><h1>サイコロの「出やすさ」を考えよう</h1></header>
<section class="box scene" aria-label="サイコロと確率の図"><svg viewBox="0 0 360 190" role="img" aria-label="6つの面が同様に確からしいサイコロ"><rect x="12" y="12" width="336" height="166" rx="15" fill="#0b1422" stroke="#334155"/><g id="die" transform="translate(92 35)"><rect width="120" height="120" rx="18" fill="#172235" stroke="#7dd3fc" stroke-width="3"/><g fill="#fbbf24" id="pips"></g></g><text x="247" y="83" text-anchor="middle" fill="#e2e8f0" font-size="16">当たりの目</text><text id="fraction" x="247" y="116" text-anchor="middle" fill="#38bdf8" font-size="25" font-weight="700">1 / 6</text></svg></section>
<section class="stats" aria-label="確率と試行結果"><div class="box stat"><small>当たりの目</small><strong id="successValue">1</strong></div><div class="box stat"><small>理論上の確率</small><strong id="probValue">1/6</strong></div><div class="box stat"><small>実験結果</small><strong id="resultValue">—</strong></div></section>
<section class="controls"><div class="row"><label for="success">当たりの目</label><input id="success" type="range" min="1" max="6" step="1" value="1"><output id="successOut">1 / 6</output></div><div class="row"><label for="trials">試行回数</label><input id="trials" type="range" min="10" max="1000" step="10" value="100"><output id="trialsOut">100回</output></div></section>
<div class="buttons"><button class="primary" id="roll" type="button">サイコロを振る</button><button id="reset" type="button">リセット</button></div><p class="explain" id="explain" aria-live="polite">1〜6が同じ確からしさなら、1の出る確率は1/6です。</p><p class="footnote">確率は長い目で見た割合の目安。100回でも結果は毎回ゆれます。</p>
