<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>直線は何で決まる？ 一次関数 y=ax+b | 助手A</title><meta name="description" content="傾きaと切片bを動かして、直線の変化を目で確かめる無料の知育コンテンツ。">
<style>:root{color-scheme:dark;background:#08101d;color:#f1f5f9;font-family:system-ui,"Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:550px;margin:auto;min-height:100dvh;padding:clamp(8px,1.5vh,14px);display:flex;flex-direction:column;gap:clamp(5px,1.1vh,11px)}h1{font-size:clamp(17px,2.9vh,23px);margin:0}.sub{color:#bfcede;font-size:12px}.panel{background:#111e32;border:1px solid #34435b;border-radius:12px;padding:clamp(7px,1.1vh,12px)}.formula{text-align:center;font-size:clamp(21px,3.8vh,30px);font-weight:750;font-variant-numeric:tabular-nums}.graph{width:100%;height:clamp(180px,39vh,340px);display:block}.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:#c4d3e2}.controls{display:grid;gap:clamp(7px,1.5vh,15px)}.control{display:grid;grid-template-columns:68px 1fr 32px;align-items:center;gap:7px}.control label{font-weight:700;font-size:13px}.control output{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}input[type=range]{width:100%;height:44px;min-width:0;accent-color:#38bdf8;touch-action:pan-x}.explanations{display:grid;gap:5px}.explanations p{margin:0;font-size:13px;line-height:1.45}button{min-height:44px;border-radius:9px;border:1px solid #64748b;background:#223a5b;color:#fff;padding:0 14px;font-weight:650}details{font-size:12px;color:#c4d3e2}summary{min-height:32px;cursor:pointer}@media(max-width:430px){.graph{height:clamp(180px,36vh,300px)}}@media(max-height:650px){main{gap:2px;padding:4px}.panel{padding:6px}.graph{height:clamp(135px,28vh,180px)}.controls{gap:4px}summary{min-height:24px}.sub{font-size:11px}}</style>
</head><body><main><header><h1>直線は何で決まる？</h1><div class="sub">傾きaと切片bを動かしてみよう</div></header>
<div class="panel formula" id="equation">y = 2x + 3</div>
<div class="panel"><svg class="graph" id="plot" viewBox="0 0 340 250" role="img" aria-label="一次関数の座標平面"><defs><clipPath id="clip"><rect x="20" y="15" width="300" height="220"/></clipPath></defs><rect x="20" y="15" width="300" height="220" fill="#0b1728"/><g id="grid" clip-path="url(#clip)"></g><g clip-path="url(#clip)"><line id="function" stroke="#38bdf8" stroke-width="3.5"/><path id="rise" fill="none" stroke="#fbbf24" stroke-width="3"/><circle id="intercept" r="5.5" fill="#a78bfa" stroke="white" stroke-width="1.5"/><circle id="next" r="4" fill="#fbbf24" stroke="white" stroke-width="1"/></g><text x="324" y="127" font-size="12" fill="#cbd5e1">x</text><text x="176" y="12" font-size="12" fill="#cbd5e1">y</text><text id="riseLabel" x="205" y="100" fill="#fbbf24" font-weight="700" font-size="12">+2</text></svg>
<div class="legend"><span style="color:#a78bfa">● 切片</span><span style="color:#fbbf24">┐ 傾き（右に1）</span></div></div>
<div class="panel controls"><div class="control"><label for="a">傾き a</label><input id="a" type="range" min="-4" max="4" step="0.5" value="2"><output id="aValue">2</output></div><div class="control"><label for="b">切片 b</label><input id="b" type="range" min="-5" max="5" step="0.5" value="3"><output id="bValue">3</output></div></div>
<div class="panel explanations"><p id="slopeText">右に1進むと上に2進む</p><p id="interceptText">y軸の3を通る</p></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="sub">線の向きと上下の位置を変えてみよう</span><button type="button" id="reset">↺ 戻す</button></div>
<details><summary>くわしい説明</summary>一次関数 y=ax+b の a は「xが1増えるときのyの変化」、b は「x=0のときのy」。黄色いガイドは横に1、縦にaを示します。負のaなら右下がり、0なら水平です。</details>
</main><script type="module">
import {valueAt,description,expression} from './linear.mjs';
const q=id=>document.getElementById(id);const st={a:2,b:3};const gx=x=>170+x*20,gy=y=>125-y*20;
const grid=q('grid');
for(let n=-7;n<=7;n++){const x=gx(n),y=gy(n);grid.insertAdjacentHTML('beforeend',`<path d="M${x} 15V235 M20 ${y}H320" fill="none" stroke="#94a3b8" stroke-opacity="${n===0?.75:.15}" stroke-width="${n===0?1.6:1}"/>`);if(n!==0&&n%2===0)grid.insertAdjacentHTML('beforeend',`<text x="${x}" y="138" text-anchor="middle" fill="#aebfd4" font-size="10">${n}</text><text x="158" y="${y+3}" text-anchor="end" fill="#aebfd4" font-size="10">${n}</text>`)}
function render(){const {a,b}=st;const y0=valueAt(a,b,-9),y1=valueAt(a,b,9),start=gy(b),end=gy(valueAt(a,b,1)),d=description(a,b);
q('function').setAttribute('x1',gx(-9));q('function').setAttribute('y1',y0===null?0:gy(y0));q('function').setAttribute('x2',gx(9));q('function').setAttribute('y2',gy(y1));
q('intercept').setAttribute('cx',gx(0));q('intercept').setAttribute('cy',start);q('next').setAttribute('cx',gx(1));q('next').setAttribute('cy',end);
q('rise').setAttribute('d',`M${gx(0)} ${start}H${gx(1)}V${end}`);
q('riseLabel').setAttribute('x',gx(1)+8);q('riseLabel').setAttribute('y',Math.max(19,Math.min(230,(start+end)/2)));q('riseLabel').textContent=(a>0?'+':'')+a;
q('equation').textContent=expression(a,b);q('aValue').textContent=a;q('bValue').textContent=b;q('slopeText').textContent=d.slope;q('interceptText').textContent=d.intercept;q('a').value=a;q('b').value=b}
q('a').addEventListener('input',e=>{st.a=Number(e.target.value);render()});q('b').addEventListener('input',e=>{st.b=Number(e.target.value);render()});q('reset').addEventListener('click',()=>{st.a=2;st.b=3;render()});render();
</script></body></html>
