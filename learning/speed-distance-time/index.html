<main data-learning-subject="math">
<header><div class="lesson-top-nav"><a class="lesson-back" href="/learning/" aria-label="教材一覧へ戻る">← 教材一覧</a></div><nav class="breadcrumbs" aria-label="パンくずリスト"><ol><li><a href="/">ホーム</a></li><li><a href="/learning/">LEARNING</a></li><li><a href="/learning/#subject-math">算数</a></li><li aria-current="page">速さ・距離・時間</li></ol></nav><h1>動きとグラフはどうつながる？</h1></header>
<section class="metrics" aria-label="現在の値">
<div class="panel metric"><small>速さ</small><strong id="speedValue" class="blue">2</strong><em> m/秒</em></div>
<div class="panel metric"><small>時間</small><strong id="timeValue">3.0</strong><em> 秒</em></div>
<div class="panel metric"><small>距離</small><strong id="distanceValue" class="orange">6.0</strong><em> m</em></div>
</section>
<section class="visuals" aria-label="車の動きと時間・距離グラフ">
<div class="panel"><div class="label">車の動き <span class="hint">（0〜50m）</span></div>
<svg class="road" viewBox="0 0 320 82" role="img" aria-label="まっすぐな道を右方向へ進む車">
<rect x="10" y="14" width="300" height="45" rx="7" fill="#334155"/>
<path d="M13 36.5 H307" stroke="#cbd5e1" stroke-dasharray="10 8" stroke-width="2"/>
<path id="roadTrail" d="M20 65 H20" stroke="#38bdf8" stroke-width="3"/>
<g id="car" transform="translate(20 35)"><rect x="-10" y="-9" width="20" height="18" rx="4" fill="#38bdf8" stroke="#e0f2fe"/><rect x="-4" y="-6" width="9" height="12" rx="2" fill="#075985"/><rect x="-8" y="-12" width="5" height="4" rx="1" fill="#0f172a"/><rect x="4" y="-12" width="5" height="4" rx="1" fill="#0f172a"/><rect x="-8" y="8" width="5" height="4" rx="1" fill="#0f172a"/><rect x="4" y="8" width="5" height="4" rx="1" fill="#0f172a"/></g>
<text x="13" y="79" fill="#cbd5e1" font-size="10">0m</text><text x="307" y="79" text-anchor="end" fill="#cbd5e1" font-size="10">50m</text></svg></div>
<div class="panel"><div class="label">時間と距離のグラフ <span class="hint">● 現在位置</span></div>
<svg class="chart" viewBox="0 0 320 178" role="img" aria-label="横軸は時間0〜10秒、縦軸は距離0〜50m"><g id="grid"></g>
<path id="graphLine" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
<path id="guides" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle id="graphPoint" r="5" stroke="#fff" stroke-width="2" fill="#f59e0b"/>
<text id="pointText" fill="#fbbf24" font-size="10" font-weight="650"></text>
</svg></div>
</section>
<section class="panel controls" aria-label="操作">
<div class="control-row"><label for="speed">速さ</label><input id="speed" type="range" min="0" max="5" step="0.5" value="2"><output id="speedOut" for="speed">2 m/秒</output></div>
<div class="control-row"><label for="time">時間</label><input id="time" type="range" min="0" max="10" step="0.01" value="3"><output id="timeOut" for="time">3.0 秒</output></div>
<div class="buttons"><button type="button" class="primary" id="play" aria-pressed="false">▶ 再生</button><button type="button" id="reset">↺ リセット</button></div>
</section>
<section class="panel"><p id="explain" class="explain" aria-live="off">1秒ごとに2m進む。</p></section>
<details><summary>くわしい説明・使い方</summary><p>速さが一定のとき、距離＝速さ×時間。グラフの傾きは速さを表します。速さ0では時間が進んでも距離は増えません。速さを途中で変更すると、これは「最初からその速さで走った場合」の比較に切り替わります（走行履歴ではありません）。</p></details>
<nav class="lesson-exit" aria-label="教材の出口"><a href="/learning/">← 教材一覧へ戻る</a></nav>
</main>
<script type="module">
import {distance, describe, formatTime, formatValue, createMotionState, setSpeed, seekTime, pauseMotion, startMotion, resetMotion, advanceMotion} from './motion.mjs';
const q=id=>document.getElementById(id);
const state=createMotionState();
const ns='http://www.w3.org/2000/svg',grid=q('grid');
function line(x1,y1,x2,y2,opacity){const e=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1,y1,x2,y2,stroke:'#94a3b8','stroke-opacity':opacity,'stroke-width':1}))e.setAttribute(k,v);grid.append(e)}
function label(x,y,text,anchor='middle'){const e=document.createElementNS(ns,'text');for(const [k,v] of Object.entries({x,y,fill:'#b7c5d7','font-size':10,'text-anchor':anchor}))e.setAttribute(k,v);e.textContent=text;grid.append(e)}
const gx=t=>32+272*t/10,gy=d=>150-130*d/50;
for(let t=0;t<=10;t+=2){line(gx(t),20,gx(t),150,.15);label(gx(t),164,String(t))}
for(let d=0;d<=50;d+=10){line(32,gy(d),304,gy(d),.15);label(27,gy(d)+3,String(d),'end')}
line(32,16,32,150,.8);line(32,150,308,150,.8);label(33,11,'距離(m)','start');label(303,176,'時間(秒)','end');
function paint(){const v=state.speed,t=Number(formatTime(state.time)),d=distance(v,t),x=gx(t),y=gy(d);
q('speedValue').textContent=v;q('timeValue').textContent=formatTime(t);q('distanceValue').textContent=formatValue(d);
q('speedOut').textContent=v+' m/秒';q('timeOut').textContent=formatTime(t)+' 秒';
q('speed').value=v;q('time').value=t;
q('car').setAttribute('transform','translate('+(20+280*d/50)+' 35)');
q('roadTrail').setAttribute('d','M20 65 H'+(20+280*d/50));
q('graphLine').setAttribute('d','M'+gx(0)+' '+gy(0)+' L'+gx(10)+' '+gy(distance(v,10)));
q('guides').setAttribute('d','M'+x+' 150 V'+y+' H32');
q('graphPoint').setAttribute('cx',x);q('graphPoint').setAttribute('cy',y);
q('pointText').textContent=formatTime(t)+'秒 / '+formatValue(d)+'m';
const pointLabelWidth=q('pointText').getComputedTextLength(),alignRight=x+7+pointLabelWidth>315;
q('pointText').setAttribute('text-anchor',alignRight?'end':'start');q('pointText').setAttribute('x',alignRight?x-7:x+7);q('pointText').setAttribute('y',y<24?y+15:y-8);
q('explain').textContent=describe(v,t);
q('play').textContent=state.playing?'Ⅱ 一時停止':'▶ 再生';q('play').setAttribute('aria-pressed',String(state.playing));
}
q('speed').addEventListener('input',e=>{setSpeed(state,Number(e.target.value));paint()});
q('time').addEventListener('input',e=>{seekTime(state,Number(e.target.value));paint()});
q('play').addEventListener('click',()=>{if(state.playing)pauseMotion(state);else startMotion(state);paint()});
q('reset').addEventListener('click',()=>{resetMotion(state);paint()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseMotion(state);paint()}});
function frame(now){advanceMotion(state,now);paint();requestAnimationFrame(frame)}
paint();requestAnimationFrame(frame);
</script></body></html>
