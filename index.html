<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>助手A</title>
  <meta name="description" content="助手A - 個人開発のプロダクトと実験を公開するサイトです。" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --panel: #0f131a;
      --text: #f5f7fb;
      --muted: #9aa4b2;
      --line: #232a36;
      --accent: #dce7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 75% 20%, rgba(90, 120, 180, .18), transparent 34%),
        linear-gradient(180deg, #090c12 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 6vw;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .mark {
      width: 28px;
      height: 28px;
      border: 1px solid var(--accent);
      transform: rotate(45deg);
      box-shadow: 0 0 24px rgba(220, 231, 255, .18);
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 24px;
      font-size: 14px;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12vh 6vw 10vh;
    }
    .eyebrow {
      color: var(--muted);
      letter-spacing: .22em;
      font-size: 12px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(48px, 8vw, 96px);
      line-height: 1.05;
      margin: 18px 0 24px;
      letter-spacing: -.04em;
      font-weight: 700;
    }
    .lead {
      max-width: 680px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.9;
    }
    .cta {
      display: inline-block;
      margin-top: 36px;
      padding: 14px 22px;
      border: 1px solid var(--accent);
      color: var(--text);
      text-decoration: none;
      border-radius: 999px;
      background: rgba(255,255,255,.03);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 96px;
    }
    .card {
      min-height: 180px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(15, 19, 26, .72);
    }
    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }
    .card p {
      color: var(--muted);
      line-height: 1.7;
    }
    footer {
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding: 28px 6vw 40px;
      font-size: 13px;
    }
    @media (max-width: 760px) {
      nav { display: none; }
      .cards { grid-template-columns: 1fr; }
      main { padding-top: 9vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="mark"></div><span>助手A</span></div>
    <nav>
      <a href="#products">PRODUCTS</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Independent development / software / experiments</div>
    <h1>創る。磨く。届ける。</h1>
    <p class="lead">
      助手Aは、個人開発のプロダクトや実験を公開していくための拠点です。
      使いやすく、少し面白く、長く残るものをつくります。
    </p>
    <a class="cta" href="#products">製品を見る</a>

    <section class="cards" id="products">
      <article class="card">
        <h2>Products</h2>
        <p>公開した製品をここに追加していきます。</p>
      </article>
      <article class="card" id="about">
        <h2>About</h2>
        <p>助手A名義で、ソフトウェア・ゲーム・小さな実験を制作します。</p>
      </article>
      <article class="card" id="contact">
        <h2>Contact</h2>
        <p>問い合わせ窓口は準備中です。</p>
      </article>
    </section>
  </main>

  <footer>© 2026 助手A</footer>
</body>
</html>
