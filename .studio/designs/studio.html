<!doctype html><html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>稜線建築｜建築設計</title>
<style>
:root {
  --paper:#eae8e1;
  --ink:#272723;
}
* {
  box-sizing:border-box;
}
html {
  scroll-behavior:smooth;
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:1rem/1.8 system-ui,sans-serif;
  overflow-wrap:anywhere;
}
img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
a {
  color:inherit;
  text-underline-offset:.28em;
}
h1,h2,h3,p,figure {
  margin:0;
}
h1,h2 {
  line-height:1.12;
  text-wrap:balance;
}
h1 {
  font-size:clamp(3.4rem,8vw,8.8rem);
  letter-spacing:-.055em;
}
h2 {
  font-size:clamp(1.75rem,4vw,3.5rem);
}
header,footer,.bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
}
header,footer,section {
  padding:clamp(1.1rem,4vw,4rem);
}
header {
  padding-block:1rem;
  border-bottom:1px solid;
}
header a,footer a {
  font-size:.9rem;
}
footer {
  border-top:1px solid;
}
nav {
  display:flex;
  gap:1.2rem;
}
.rows {
  margin:1.4rem 0 0;
}
.row {
  padding:1.05rem 0;
  border-top:1px solid;
  display:flex;
  justify-content:space-between;
  gap:1rem;
  align-items:baseline;
}
.row span {
  max-width:65%;
}
.cap {
  font:600 .8rem/1.5 system-ui;
  letter-spacing:.13em;
}
.action {
  display:inline-block;
  margin-top:1.3rem;
  font-weight:650;
}
.copy {
  max-width:38rem;
  margin-top:1rem;
}
figure {
  overflow:hidden;
}
@media(prefers-reduced-motion:reduce) {
  html {
    scroll-behavior:auto;
  }
}
.cover {
  position:relative;
  padding:0;
  height:73vh;
}
.cover h1 {
  position:absolute;
  bottom:0;
  background:var(--paper);
  padding:.15em .45em;
}
#detail figure {
  margin:2rem 0 0 auto;
  width:76%;
  height:38vh;
}
#visit {
  max-width:750px;
}
</style>
</head>
<body id="top">
<header><strong>稜線建築</strong>
<nav><a href="#detail">作品</a><a href="#visit">設計ノート</a></nav>
</header>
<main>
<section class="cover"><img src="../art/architecture.webp" alt="中庭を囲む建築模型">
<h1>稜線建築</h1>
</section>
<section id="detail">
<h2>中庭にひらく家</h2>
<p class="copy">壁の高さを少しずつ変え、歩くたびに中庭が違って見える住まいを考えました。</p>
<figure><img src="../art/interior.webp" alt="光が差す室内"></figure>
</section>
<section id="visit">
<h2>設計ノート</h2>
<p class="copy">光の向き、風の抜け道、通りとの距離。敷地を歩き、暮らしの輪郭から設計を始めます。</p>
</section>
</main>
<footer><strong>稜線建築</strong><a href="#top">先頭へ ↑</a></footer>
</body>
</html>
