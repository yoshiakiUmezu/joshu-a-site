<!doctype html><html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことのは教室｜語学スクール</title>
<style>
:root {
  --paper:#faf7eb;
  --ink:#233a41;
}
* {
  box-sizing:border-box;
}
html {
  scroll-behavior:smooth;
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:1rem/1.8 system-ui,sans-serif;
  overflow-wrap:anywhere;
}
img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
a {
  color:inherit;
  text-underline-offset:.28em;
}
h1,h2,h3,p,figure {
  margin:0;
}
h1,h2 {
  line-height:1.12;
  text-wrap:balance;
}
h1 {
  font-size:clamp(3.4rem,8vw,8.8rem);
  letter-spacing:-.055em;
}
h2 {
  font-size:clamp(1.75rem,4vw,3.5rem);
}
header,footer,.bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
}
header,footer,section {
  padding:clamp(1.1rem,4vw,4rem);
}
header {
  padding-block:1rem;
  border-bottom:1px solid;
}
header a,footer a {
  font-size:.9rem;
}
footer {
  border-top:1px solid;
}
nav {
  display:flex;
  gap:1.2rem;
}
.rows {
  margin:1.4rem 0 0;
}
.row {
  padding:1.05rem 0;
  border-top:1px solid;
  display:flex;
  justify-content:space-between;
  gap:1rem;
  align-items:baseline;
}
.row span {
  max-width:65%;
}
.cap {
  font:600 .8rem/1.5 system-ui;
  letter-spacing:.13em;
}
.action {
  display:inline-block;
  margin-top:1.3rem;
  font-weight:650;
}
.copy {
  max-width:38rem;
  margin-top:1rem;
}
figure {
  overflow:hidden;
}
@media(prefers-reduced-motion:reduce) {
  html {
    scroll-behavior:auto;
  }
}
.lesson {
  text-align:center;
  padding-block:7vw;
}
.lesson h1 {
  font-size:clamp(2.8rem,7vw,7rem);
}
.lesson nav {
  margin:2rem auto 0;
  max-width:700px;
}
.lesson nav a {
  flex:1;
  background:#f3c59a;
  padding:1.4rem .5rem;
  text-decoration:none;
  font-weight:700;
}
.lesson nav a+a {
  background:#b2d4c8;
}
#detail {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2rem;
}
#detail h2 {
  grid-column:1/-1;
}
article {
  border-top:2px solid;
  padding-top:1rem;
}
#visit {
  background:#233a41;
  color:white;
}
</style>
</head>
<body id="top">
<header><strong>ことのは教室</strong>
<nav><a href="#detail">クラス</a><a href="#visit">体験</a></nav>
</header>
<main>
<section class="lesson">
<h1>どんな場面で<br>話したい？</h1>
<nav><a href="#trip">旅先で話す ↘</a><a href="#life">日常で話す ↘</a></nav>
</section>
<section id="detail">
<h2>ふたつのクラス</h2>
<article id="trip">
<h3>旅先の会話</h3>
<p>道を尋ねる、食事を注文する。旅の場面を二人組で練習します。</p></article>
<article id="life">
<h3>暮らしの会話</h3>
<p>休日の話やちょっとした相談を題材に、聞く力と返す力を育てます。</p></article>
</section>
<section id="visit">
<h2>体験レッスン</h2>
<p>土曜 10:00から45分。筆記用具だけお持ちください。</p>
</section>
</main>
<footer><strong>ことのは教室</strong><a href="#top">先頭へ ↑</a></footer>
</body>
</html>
