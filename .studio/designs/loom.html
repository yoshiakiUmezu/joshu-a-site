<!doctype html><html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOM STOCK｜古着店</title>
<style>
:root {
  --paper:#faf5ef;
  --ink:#312a29;
}
* {
  box-sizing:border-box;
}
html {
  scroll-behavior:smooth;
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:1rem/1.8 system-ui,sans-serif;
  overflow-wrap:anywhere;
}
img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
a {
  color:inherit;
  text-underline-offset:.28em;
}
h1,h2,h3,p,figure {
  margin:0;
}
h1,h2 {
  line-height:1.12;
  text-wrap:balance;
}
h1 {
  font-size:clamp(3.4rem,8vw,8.8rem);
  letter-spacing:-.055em;
}
h2 {
  font-size:clamp(1.75rem,4vw,3.5rem);
}
header,footer,.bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
}
header,footer,section {
  padding:clamp(1.1rem,4vw,4rem);
}
header {
  padding-block:1rem;
  border-bottom:1px solid;
}
header a,footer a {
  font-size:.9rem;
}
footer {
  border-top:1px solid;
}
nav {
  display:flex;
  gap:1.2rem;
}
.rows {
  margin:1.4rem 0 0;
}
.row {
  padding:1.05rem 0;
  border-top:1px solid;
  display:flex;
  justify-content:space-between;
  gap:1rem;
  align-items:baseline;
}
.row span {
  max-width:65%;
}
.cap {
  font:600 .8rem/1.5 system-ui;
  letter-spacing:.13em;
}
.action {
  display:inline-block;
  margin-top:1.3rem;
  font-weight:650;
}
.copy {
  max-width:38rem;
  margin-top:1rem;
}
figure {
  overflow:hidden;
}
@media(prefers-reduced-motion:reduce) {
  html {
    scroll-behavior:auto;
  }
}
.look {
  display:grid;
  grid-template-columns:1fr .9fr .55fr;
  align-items:end;
  gap:1vw;
}
.look h1 {
  font:900 clamp(2.8rem,8vw,8rem)/.83 Arial;
  letter-spacing:-.07em;
}
.look figure {
  height:55vh;
}
.look figure:last-child {
  height:33vh;
}
#detail figure {
  height:30vh;
  margin-top:2rem;
}
#visit {
  background:#d9cebd;
}
@media(max-width:600px) {
  .look {
    grid-template-columns:1fr .65fr;
  }
  .look h1 {
    grid-column:1/-1;
  }
  .look figure {
    height:36vh;
  }
}
</style>
</head>
<body id="top">
<header><strong>LOOM STOCK</strong>
<nav><a href="#detail">入荷</a><a href="#visit">試着</a></nav>
</header>
<main>
<section class="look">
<h1>LOOM<br>STOCK</h1>
<figure><img src="../art/outfit.webp" alt="コーディネートのイメージ"></figure>
<figure><img src="../art/denim.webp" alt="デニムの質感"></figure>
</section>
<section id="detail">
<h2>今週のラック</h2>
<p class="copy">色褪せたインディゴ、やわらかな生成り。着込んだからこそ生まれた表情を選びました。</p>
<figure><img src="../art/rack.webp" alt="服が並ぶラック"></figure>
</section>
<section id="visit">
<h2>試着のご案内</h2>
<p>土・日 12:00–18:00。気になる一着は店頭でご試着いただけます。</p>
</section>
</main>
<footer><strong>LOOM STOCK</strong><a href="#top">先頭へ ↑</a></footer>
</body>
</html>
