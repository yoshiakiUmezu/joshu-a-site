<!doctype html><html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粒子観測所｜科学展示</title>
<style>
:root {
  --paper:#151e24;
  --ink:#c2eddb;
}
* {
  box-sizing:border-box;
}
html {
  scroll-behavior:smooth;
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:1rem/1.8 system-ui,sans-serif;
  overflow-wrap:anywhere;
}
img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
a {
  color:inherit;
  text-underline-offset:.28em;
}
h1,h2,h3,p,figure {
  margin:0;
}
h1,h2 {
  line-height:1.12;
  text-wrap:balance;
}
h1 {
  font-size:clamp(3.4rem,8vw,8.8rem);
  letter-spacing:-.055em;
}
h2 {
  font-size:clamp(1.75rem,4vw,3.5rem);
}
header,footer,.bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
}
header,footer,section {
  padding:clamp(1.1rem,4vw,4rem);
}
header {
  padding-block:1rem;
  border-bottom:1px solid;
}
header a,footer a {
  font-size:.9rem;
}
footer {
  border-top:1px solid;
}
nav {
  display:flex;
  gap:1.2rem;
}
.rows {
  margin:1.4rem 0 0;
}
.row {
  padding:1.05rem 0;
  border-top:1px solid;
  display:flex;
  justify-content:space-between;
  gap:1rem;
  align-items:baseline;
}
.row span {
  max-width:65%;
}
.cap {
  font:600 .8rem/1.5 system-ui;
  letter-spacing:.13em;
}
.action {
  display:inline-block;
  margin-top:1.3rem;
  font-weight:650;
}
.copy {
  max-width:38rem;
  margin-top:1rem;
}
figure {
  overflow:hidden;
}
@media(prefers-reduced-motion:reduce) {
  html {
    scroll-behavior:auto;
  }
}
.lab {
  background-image:linear-gradient(#588a7629 1px,transparent 1px),linear-gradient(90deg,#588a7629 1px,transparent 1px);
  background-size:32px 32px;
  display:grid;
  grid-template-columns:1.25fr 1fr;
  align-items:end;
}
.lab .cap {
  grid-column:1/-1;
}
.lab h1 {
  margin-top:2rem;
}
.meter {
  text-align:right;
}
.meter b {
  display:block;
  font:400 clamp(4rem,12vw,12rem)/1 monospace;
  color:#fdbe71;
}
.row b,.cap {
  font-family:monospace;
}
#visit {
  background:#c2eddb;
  color:#151e24;
}
@media(max-width:600px) {
  .lab {
    grid-template-columns:1fr;
  }
  .meter {
    margin-top:1rem;
  }
}
</style>
</head>
<body id="top">
<header><strong>粒子観測所</strong>
<nav><a href="#detail">観察手順</a><a href="#visit">開放日</a></nav>
</header>
<main>
<section class="lab">
<p class="cap">光の実験展示</p>
<h1>影の長さを<br>測る。</h1>
<div class="meter"><b>45°</b><span>観察台の入射角</span></div>
</section>
<section id="detail">
<h2>観察手順</h2>
<div class="rows">
<div class="row"><b>光源を置く</b><span>目盛りの線に合わせてランプをセット。</span></div>
<div class="row"><b>角度を変える</b><span>光の入る角度を15°ずつ傾けます。</span></div>
<div class="row"><b>記録する</b><span>同じ棒の影がどう伸びるかを比べます。</span></div></div>
</section>
<section id="visit">
<h2>実験室の開放日</h2>
<p>土曜日 13:00–16:00。1回の観察は約15分です。</p>
</section>
</main>
<footer><strong>粒子観測所</strong><a href="#top">先頭へ ↑</a></footer>
</body>
</html>
