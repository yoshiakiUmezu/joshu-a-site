name: PR19 verify
on:
  push:
    branches:
      - feature/learning-linear-function
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Math tests
        run: |
          npm run test:motion
          npm run test:point-p
          npm run test:linear-function
      - name: Mobile tests
        run: |
          npm run test:mobile-browser
          npm run test:point-p-mobile
          npm run test:linear-function-mobile
      - name: Release tests
        run: |
          node --test tests/check-release.test.mjs tests/build-products.test.mjs
          node scripts/check-release.mjs
          git diff --check
