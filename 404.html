<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ページが見つかりません | 助手A</title>
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#07090d" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --text: #f4f7fb;
      --muted: #a8b0bc;
      --line: rgba(201, 214, 232, .16);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 74% 18%, rgba(84, 116, 170, .14), transparent 30%),
        linear-gradient(180deg, #080b10 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }

    main {
      width: min(620px, 100%);
      padding: clamp(28px, 6vw, 54px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.018);
      box-shadow: 0 28px 70px rgba(0,0,0,.22);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 44px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .brand img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .code {
      margin: 0 0 10px;
      color: #778191;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.18;
      letter-spacing: -.035em;
    }

    p {
      margin: 22px 0 0;
      color: var(--muted);
      line-height: 1.9;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .primary {
      background: #fff;
      color: #0b0f15;
      border: 1px solid #fff;
    }

    .secondary {
      color: var(--text);
      border: 1px solid var(--line);
    }

    a:focus-visible {
      outline: 2px solid #dce7fb;
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="助手A ホーム">
      <img src="/assets/brand-mark.png" width="30" height="30" alt="" aria-hidden="true" />
      <span>助手A</span>
    </a>

    <p class="code">404 / Not Found</p>
    <h1>このページは見つかりません。</h1>
    <p>
      URLが変更されたか、ページがまだ公開されていない可能性があります。
      トップページから目的の情報をお探しください。
    </p>

    <div class="actions">
      <a class="btn primary" href="/">トップへ戻る</a>
      <a class="btn secondary" href="/#contact">お問い合わせ</a>
    </div>
  </main>
</body>
</html>
